


[package]
name = "downloader"
version = "0.1.0"
edition = "2018"
[dependencies]
actix-web = "4.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
[[bin]]
name = "downloader"
path = "src/main.rs"
